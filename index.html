
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 像百度一样搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 15vh;
        }
        /* 网站标题 */
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }
        /* 搜索框区域 */
        .search-box {
            display: flex;
            width: 600px;
            margin-bottom: 40px;
        }
        .search-input {
            flex: 1;
            height: 44px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 22px 0 0 22px;
            outline: none;
            font-size: 16px;
        }
        .search-input:focus {
            border-color: #3c78f0;
        }
        .search-btn {
            width: 100px;
            height: 44px;
            background-color: #3c78f0;
            color: white;
            border: none;
            border-radius: 0 22px 22px 0;
            cursor: pointer;
            font-size: 16px;
        }
        .search-btn:hover {
            background-color: #2b65d9;
        }
        /* 分类导航区域 */
        .nav-list {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
        }
        .nav-item {
            padding: 10px 20px;
            background-color: #f5f5f5;
            border-radius: 20px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }
        .nav-item:hover {
            background-color: #eee;
        }
        /* 页脚 */
        footer {
            position: fixed;
            bottom: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- 网站标题 -->
    <div class="logo">我的搜索主页</div>

    <!-- 主搜索框（用百度实现搜索） -->
    <div class="search-box">
        <input type="text" class="search-input" id="mainInput" placeholder="在这里搜索任何内容...">
        <button class="search-btn" onclick="doSearch()">搜索一下</button>
    </div>

    <!-- 分类导航（直接跳转到对应平台） -->
    <div class="nav-list">
        <a href=" " target="_blank" class="nav-item">📰 新闻</a >
        <a href="https://www.iqiyi.com/" target="_blank" class="nav-item">🎬 电影</a >
        <a href="https://music.163.com/" target="_blank" class="nav-item">🎵 音乐</a >
        <a href="https://www.taobao.com/" target="_blank" class="nav-item">🛒 购物</a >
        <a href="https://map.baidu.com/" target="_blank" class="nav-item">🗺️ 地图</a >
    </div>

    <footer>
        我的第一个网站 · Powered by GitHub Pages
    </footer>

    <script>
        // 主搜索框的功能：跳转到百度搜索
        function doSearch() {
            const keyword = document.getElementById("mainInput").value.trim();
            if (keyword) {
                // 用百度来实现搜索
                window.location.href = `https://www.baidu.com/s?wd=${encodeURIComponent(keyword)}`;
            }
        }
        // 按回车键也能触发搜索
        document.getElementById("mainInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                doSearch();
            }
        });
    </script>
</body>
</html>
